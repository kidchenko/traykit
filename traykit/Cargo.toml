[package]
name         = "traykit"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.77"
description  = "The runtime pieces every kidchenko tray app shares"
authors      = ["kidchenko <kidchenko@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/kidchenko/traykit"

[dependencies]
serde      = "1"
serde_json = "1"

# Bindings only; everything called ships with Windows. The apps already pull
# the same version in, so this adds features, not a second copy.
[target.'cfg(windows)'.dependencies.windows]
version  = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# NSUserDefaults and NSColor for the theme; libc for localtime_r.
[target.'cfg(target_os = "macos")'.dependencies]
libc             = "0.2"
objc2            = "0.6"
objc2-app-kit    = "0.3"
objc2-foundation = "0.3"

# gtk is how tao and tray-icon run on Linux already; the theme asks the
# desktop portal through its gio.
[target.'cfg(target_os = "linux")'.dependencies]
gtk  = "0.18"
libc = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
